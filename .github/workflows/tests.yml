name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  # Ночной прогон — фреймворк «живёт», ловит флаки и факелы со стороны SUT.
  schedule:
    - cron: "0 3 * * *"

# Отмена устаревшего запуска при новом пуше в ту же ветку — не тратим ресурсы.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy
        run: mypy

  unit:
    # Мгновенные unit-тесты клиента: моки, без SUT/сети. Запускаем сразу —
    # если клиент сломали, нет смысла гнать интеграцию.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run unit tests (mocked, no network)
        run: pytest -m unit

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run landing API tests
        run: pytest -m api
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results/

  backend:
    runs-on: ubuntu-latest
    # Backend API восстановлен из Mini App без документации (API discovery).
    # Контрактные и негативные тесты не требуют валидного Telegram initData;
    # happy-path включается через секрет TELEGRAM_INIT_DATA.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run backend API tests
        run: pytest -m backend
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-backend
          path: allure-results/

  security:
    # Security-проверки: security-заголовки лендинга/Mini App + брутфорс-защита
    # /api/auth. Найденные дефекты помечены xfail — CI остаётся зелёным, но
    # находки документированы в отчёте и станут xpass, когда владелец починит.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run security tests
        run: pytest -m security
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-security
          path: allure-results/

  ui:
    runs-on: ubuntu-latest
    # UI-тесты лендинга + Mini App в одном браузерном job. ubuntu-latest содержит
    # Firefox «из коробки»; geckodriver докачивает встроенный Selenium Manager.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run UI tests (landing + Mini App, headless)
        run: pytest -m "ui or miniapp"
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui
          path: allure-results/

  report:
    # Собираем единый Allure-отчёт и публикуем через ОФИЦИАЛЬНЫЙ Pages-пайплайн
    # (actions/deploy-pages), совместимый с Settings → Pages → Source: GitHub Actions.
    # if: always() — отчёт нужен даже при падениях тестов (ради него и пишем).
    needs: [api, backend, security, ui]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Install Allure CLI
        run: |
          curl -sL https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.zip -o /tmp/allure.zip
          unzip -q /tmp/allure.zip -d /tmp
          echo "/tmp/allure-2.30.0/bin" >> "$GITHUB_PATH"
      - name: Download API, backend & UI results
        uses: actions/download-artifact@v4
        with:
          path: allure-results
          pattern: allure-results-*
          merge-multiple: true
      - name: Generate Allure report
        run: allure generate allure-results -o _site --clean
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

  docker-build:
    # Проверяем, что Dockerfile действительно собирается — портативность
    # подтверждена на CI, а не «у меня на машине работает».
    needs: [lint, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t 4to-vpn-aqa:ci .