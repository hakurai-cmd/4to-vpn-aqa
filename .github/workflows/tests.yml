name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  # Ночной прогон — фреймворк «живёт», ловит флаки и факелы со стороны SUT.
  schedule:
    - cron: "0 3 * * *"

# Отмена устаревшего запуска при новом пуше в ту же ветку — не тратим ресурсы.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy
        run: mypy

  unit:
    # Мгновенные unit-тесты клиента: моки, без SUT/сети. Запускаем сразу —
    # если клиент сломали, нет смысла гнать интеграцию.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run unit tests (mocked, no network)
        run: pytest -m unit

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run landing API tests
        run: pytest -m api
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results/

  backend:
    runs-on: ubuntu-latest
    # Backend API восстановлен из Mini App без документации (API discovery).
    # Контрактные и негативные тесты не требуют валидного Telegram initData;
    # happy-path включается через секрет TELEGRAM_INIT_DATA.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run backend API tests
        run: pytest -m backend
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-backend
          path: allure-results/

  ui:
    runs-on: ubuntu-latest
    # UI-тесты лендинга + Mini App в одном браузерном job. ubuntu-latest содержит
    # Firefox «из коробки»; geckodriver докачивает встроенный Selenium Manager.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run UI tests (landing + Mini App, headless)
        run: pytest -m "ui or miniapp"
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui
          path: allure-results/

  report:
    # Собираем единый Allure-отчёт из API, backend и UI и публикуем в GitHub Pages.
    # if: always() — отчёт нужен даже при падениях (ради него и пишем).
    needs: [api, backend, ui]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write # для деплоя в ветку gh-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Allure CLI
        run: |
          curl -sL https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.zip -o /tmp/allure.zip
          unzip -q /tmp/allure.zip -d /tmp
          echo "/tmp/allure-2.30.0/bin" >> "$GITHUB_PATH"
      - name: Download API, backend & UI results
        uses: actions/download-artifact@v4
        with:
          path: allure-results
          pattern: allure-results-*
          merge-multiple: true
      - name: Generate Allure report
        run: allure generate allure-results -o _site --clean
      - name: Deploy to GitHub Pages
        # continue-on-error: деплой требует, чтобы владелец включил
        # Settings → Pages → Source: GitHub Actions. Пока не включено — шаг
        # падает, но НЕ красит бейдж: статус пайплайна отражает тесты, а не Pages.
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: allure-report

  docker-build:
    # Проверяем, что Dockerfile действительно собирается — портативность
    # подтверждена на CI, а не «у меня на машине работает».
    needs: [lint, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t 4to-vpn-aqa:ci .