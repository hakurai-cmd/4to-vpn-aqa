[pytest]
addopts = -v -s --alluredir=allure-results --strict-markers
testpaths = tests
markers =
    api: API and HTTP tests
    ui: UI tests (Selenium)
    backend: Backend API tests (Mini App)
    miniapp: Telegram Mini App UI tests (Selenium, mobile)
    unit: Unit tests (mocked, no network/SUT)
    security: Security tests (headers, rate-limiting)